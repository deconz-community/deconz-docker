---
name: Build and push release image

on:
  push:
    branches: ['main']
    paths:
      - 'docker/**'
      - 'version.json'
  workflow_dispatch:

concurrency:
  group: release-image-publish
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  release-build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: standard
            dockerfile: docker/Dockerfile
            platforms: linux/amd64,linux/arm/v7,linux/arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USER }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get version
        id: version
        uses: actions/github-script@v8
        with:
          script: |
            const { version } = require('./version.json');
            core.setOutput('prop', version);

      - name: Get channel
        id: channel
        uses: actions/github-script@v8
        with:
          script: |
            const { channel } = require('./version.json');
            core.setOutput('prop', channel);

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./docker/
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.prop }}
            CHANNEL=${{ steps.channel.outputs.prop }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            deconzcommunity/deconz:latest
            deconzcommunity/deconz:${{ steps.version.outputs.prop }}
            deconzcommunity/deconz:${{ steps.channel.outputs.prop }}
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.prop }}
            ghcr.io/${{ github.repository }}:${{ steps.channel.outputs.prop }}
          labels: |
            org.opencontainers.image.vendor=${{ github.repository_owner }}
            org.opencontainers.image.revision=${{ github.sha }}
